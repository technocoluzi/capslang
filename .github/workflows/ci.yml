name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked

      - name: Build
        run: cargo build --release --locked

      # The installer script is the other thing that can break a release, so
      # compile it here too rather than finding out at tag time.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /Qp /DAppVersion=0.0.0 installer\capslang.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Store package is the other shippable artifact, and makeappx is
      # already on the runner, so a broken manifest surfaces here rather than
      # at submission time.
      - name: Build MSIX
        shell: pwsh
        run: ./packaging/build-msix.ps1 -Version 0.0.0.0

      # The packaged code paths are unreachable without a registered package,
      # and registering an unsigned one needs Developer Mode. Doing it here
      # keeps that toggle on a throwaway machine instead of a developer's.
      - name: Test the packaged build
        shell: pwsh
        run: ./packaging/test-msix.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: capslang-dev-build
          path: |
            target/release/capslang.exe
            dist/*.exe
            dist/*.msix
          if-no-files-found: error
